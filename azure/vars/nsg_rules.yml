---
nsg_rules:
  - name: allow-http
    priority: 110
    direction: Inbound
    access: Allow
    protocol: Tcp
    destination_port_range: 80
  - name: allow-https
    priority: 120
    direction: Inbound
    access: Allow
    protocol: Tcp
    destination_port_range: 443
  - name: allow-ssh-from-me
    priority: 130
    direction: Inbound
    access: Allow
    protocol: Tcp
    destination_port_range: 22
    source_address_prefix: "{{ lookup('ansible.builtin.pipe', 'curl -s https://api.ipify.org') }}/32"
